<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英会話ディクテくん</title>

<style>
body {
    background-color: #000;
    color: #FFFF00;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 26px;
    padding: 20px;
    margin: 0;
    height: 100vh;
}

#status {
    font-size: 18px;
    margin-bottom: 10px;
}

#startBtn {
    background: #333;
    color: white;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: inline-block;
}

#container {
    height: calc(100vh - 160px);
    overflow-y: auto;
}

#result {
    white-space: pre-wrap;
    line-height: 1.6;
}

#translation {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111;
    color: #00FFAA;
    font-size: 18px;
    padding: 12px;
}
</style>
</head>

<body>

<div id="status">停止中</div>

<div id="startBtn">録音開始 / 停止</div>

<div id="container">
<div id="result">
ここに文字が出ます。
</div>
</div>

<div id="translation">
ここに翻訳が出ます
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    document.getElementById('status').innerText = "非対応ブラウザ";
} else {

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    let isListening = false;
    let finalText = "";

    const statusDiv = document.getElementById("status");
    const resultDiv = document.getElementById("result");
    const container = document.getElementById("container");
    const startBtn = document.getElementById("startBtn");

    // ✅ 録音はボタンだけで操作
    startBtn.onclick = () => {
        if (!isListening) {
            finalText = "";
            resultDiv.innerText = "";
            recognition.start();
        } else {
            isListening = false;
            recognition.stop();
        }
    };

    recognition.onstart = () => {
        isListening = true;
        statusDiv.innerText = "● Listening...";
        statusDiv.style.color = "red";
    };

    recognition.onresult = (event) => {
        let interim = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                finalText += event.results[i][0].transcript + "\n";
            } else {
                interim += event.results[i][0].transcript;
            }
        }

        resultDiv.innerText = finalText + interim;
        container.scrollTop = container.scrollHeight;
    };

    recognition.onend = () => {
        if (isListening) recognition.start();
        else {
            statusDiv.innerText = "停止中";
            statusDiv.style.color = "yellow";
        }
    };

    // ✅ 長押し・ドラッグ対応（ここが最重要）
    document.addEventListener("selectionchange", () => {
        setTimeout(() => {
            const text = window.getSelection().toString().trim();

            if (text.length > 0) {
                translate(text);
            }
        }, 200); // 選択確定待ち
    });

    // ✅ 翻訳
    async function translate(text) {
        try {
            const res = await fetch(
                "https://api.mymemory.translated.net/get?q=" +
                encodeURIComponent(text) +
                "&langpair=en|ja"
            );
            const data = await res.json();

            document.getElementById("translation").innerText =
                "▶ " + text + "\n→ " + data.responseData.translatedText;

        } catch {
            document.getElementById("translation").innerText =
                "翻訳エラー";
        }
    }
}
</script>

</body>
</html>
