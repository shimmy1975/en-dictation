<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英会話ディクテくん</title>

<style>
  :root {
    --bg: #000;
    --text: #ffff66;
    --muted: #aaaaaa;
    --panel: #111;
    --panel2: #222;
    --accent: #00ffb3;
    --danger: #ff5a5a;
    --latest-bg: rgba(255, 255, 0, 0.12);
    --latest-border: rgba(255, 255, 0, 0.3);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    padding: 12px;
    border-bottom: 1px solid #222;
    background: #050505;
  }

  #title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  #controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .btn {
    appearance: none;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn.primary {
    background: #2c2c2c;
  }

  .btn.on {
    background: #1f3425;
    border-color: #3d8553;
    color: #dbffe5;
  }

  #status {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
  }

  #container {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 120px 14px;
  }

  #result {
    font-size: 24px;
    line-height: 1.65;
    font-weight: 700;
    user-select: text;
    -webkit-user-select: text;
  }

  .line {
    display: block;
    margin-bottom: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    word-break: break-word;
  }

  .line.latest {
    background: var(--latest-bg);
    border-color: var(--latest-border);
  }

  .line.interim {
    opacity: 0.95;
  }

  .word {
    cursor: pointer;
  }

  .word.active {
    background: rgba(0,255,179,0.18);
    border-radius: 6px;
    padding: 0 2px;
  }

  #translation {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid #2a2a2a;
    padding: 10px 12px 12px 12px;
  }

  #translationHeader {
    font-size: 13px;
    color: #8aeecf;
    margin-bottom: 6px;
    font-weight: 700;
  }

  #translationBody {
    font-size: 18px;
    color: var(--accent);
    line-height: 1.5;
    white-space: pre-wrap;
    min-height: 48px;
  }

  .hint {
    margin-top: 4px;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

  <div id="topbar">
    <div id="title">Dication App「英会話ディクテくん」</div>

    <div id="controls">
      <button id="recordBtn" class="btn primary">録音開始</button>
      <button id="subtitleBtn" class="btn on">字幕モード ON</button>
      <button id="clearBtn" class="btn">クリア</button>
    </div>

    <div id="status">停止中 / 単語タップで翻訳 / 長押し選択で文ごと翻訳</div>
  </div>

  <div id="container">
    <div id="result">
      <div class="line latest">ここに文字が出ます。</div>
    </div>
  </div>

  <div id="translation">
    <div id="translationHeader">翻訳</div>
    <div id="translationBody">ここに翻訳が表示されます。</div>
    <div class="hint">単語タップで単語訳。長押しで選択した場合は選択範囲を翻訳。</div>
  </div>

<script>
(function () {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  var recordBtn = document.getElementById("recordBtn");
  var subtitleBtn = document.getElementById("subtitleBtn");
  var clearBtn = document.getElementById("clearBtn");
  var statusDiv = document.getElementById("status");
  var container = document.getElementById("container");
  var resultDiv = document.getElementById("result");
  var translationBody = document.getElementById("translationBody");

  var state = {
    isListening: false,
    subtitleMode: true,
    finalLines: [],
    interimText: "",
    userInteracting: false,
    interactionTimer: null,
    selectionTimer: null,
    restartTimer: null,
    activeWordEl: null
  };

  if (!SpeechRecognition) {
    statusDiv.textContent = "このブラウザは音声認識に対応していません（Chrome / Edge / Safari 推奨）";
    recordBtn.disabled = true;
    subtitleBtn.disabled = true;
    clearBtn.disabled = true;
    return;
  }

  var recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = false;

  function setStatus(text, color) {
    statusDiv.textContent = text;
    statusDiv.style.color = color || "#aaaaaa";
  }

  function markInteracting() {
    state.userInteracting = true;
    clearTimeout(state.interactionTimer);
    state.interactionTimer = setTimeout(function () {
      state.userInteracting = false;
    }, 1800);
  }

  function hasSelection() {
    var sel = window.getSelection();
    return sel && sel.toString && sel.toString().trim().length > 0;
  }

  function isNearBottom() {
    return (container.scrollHeight - container.scrollTop - container.clientHeight) < 80;
  }

  function autoScrollIfNeeded() {
    if (state.userInteracting) return;
    if (hasSelection()) return;
    if (!isNearBottom()) return;
    container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function tokenize(text) {
    // 単語・空白・その他を分ける
    return text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*|\s+|[^A-Za-z\s]+/g) || [];
  }

  function buildLineHtml(text, latest, interim) {
    var tokens = tokenize(text);
    var html = '<div class="line' +
      (latest ? ' latest' : '') +
      (interim ? ' interim' : '') +
      '">';

    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];

      if (/^\s+$/.test(t)) {
        html += t.replace(/ /g, "&nbsp;");
      } else if (/^[A-Za-z]+(?:['’-][A-Za-z]+)*$/.test(t)) {
        var safe = escapeHtml(t);
        html += '<span class="word" data-word="' + safe + '">' + safe + '</span>';
      } else {
        html += '<span>' + escapeHtml(t) + '</span>';
      }
    }

    html += '</div>';
    return html;
  }

  function render() {
    var html = "";

    if (state.subtitleMode) {
      if (state.finalLines.length === 0 && !state.interimText) {
        html = '<div class="line latest">ここに文字が出ます。</div>';
      } else {
        for (var i = 0; i < state.finalLines.length; i++) {
          var latestFinal = (i === state.finalLines.length - 1 && !state.interimText);
          html += buildLineHtml(state.finalLines[i], latestFinal, false);
        }
        if (state.interimText) {
          html += buildLineHtml(state.interimText, true, true);
        }
      }
    } else {
      var merged = state.finalLines.join(" ");
      if (state.interimText) {
        merged += (merged ? " " : "") + state.interimText;
      }
      html = buildLineHtml(merged || "ここに文字が出ます。", true, !!state.interimText);
    }

    resultDiv.innerHTML = html;
    autoScrollIfNeeded();
  }

  function clearActiveWord() {
    if (state.activeWordEl) {
      state.activeWordEl.classList.remove("active");
      state.activeWordEl = null;
    }
  }

  async function translateText(text) {
    if (!text || !text.trim()) return;

    translationBody.textContent = "翻訳中…";

    try {
      var url = "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(text) + "&langpair=en|ja";

      var res = await fetch(url);
      var data = await res.json();

      var translated = "翻訳結果を取得できませんでした。";
      if (data && data.responseData && data.responseData.translatedText) {
        translated = data.responseData.translatedText;
      }

      translationBody.textContent = "▶ " + text + "\n→ " + translated;
    } catch (e) {
      translationBody.textContent = "翻訳エラー：ネットワークまたはAPI応答を確認してください。";
      console.error(e);
    }
  }

  // 録音ボタン
  recordBtn.addEventListener("click", function () {
    if (!state.isListening) {
      try {
        recognition.start();
      } catch (e) {
        console.log("start error", e);
      }
    } else {
      state.isListening = false;
      clearTimeout(state.restartTimer);
      try {
        recognition.stop();
      } catch (e) {
        console.log("stop error", e);
      }
    }
  });

  // 字幕モード切替
  subtitleBtn.addEventListener("click", function () {
    state.subtitleMode = !state.subtitleMode;
    subtitleBtn.textContent = state.subtitleMode ? "字幕モード ON" : "字幕モード OFF";
    if (state.subtitleMode) subtitleBtn.classList.add("on");
    else subtitleBtn.classList.remove("on");
    render();
  });

  // クリア
  clearBtn.addEventListener("click", function () {
    state.finalLines = [];
    state.interimText = "";
    clearActiveWord();
    translationBody.textContent = "ここに翻訳が表示されます。";
    render();
  });

  // 音声認識イベント
  recognition.onstart = function () {
    state.isListening = true;
    recordBtn.textContent = "録音停止";
    setStatus("● Listening...（操作中は自動スクロール停止）", "#ff6b6b");
  };

  recognition.onresult = function (event) {
    var interim = "";

    for (var i = event.resultIndex; i < event.results.length; i++) {
      var text = event.results[i][0].transcript;
      if (!text) continue;
      text = text.trim();
      if (!text) continue;

      if (event.results[i].isFinal) {
        state.finalLines.push(text);
      } else {
        interim += (interim ? " " : "") + text;
      }
    }

    state.interimText = interim;
    render();
  };

  recognition.onerror = function (event) {
    console.log("speech error:", event.error);

    if (event.error === "not-allowed") {
      state.isListening = false;
      recordBtn.textContent = "録音開始";
      setStatus("マイクが許可されていません。ブラウザのマイク許可を確認してください。", "#ff9999");
      return;
    }

    if (event.error !== "no-speech" && event.error !== "aborted") {
      setStatus("認識エラー: " + event.error, "#ff9999");
    }
  };

  recognition.onend = function () {
    if (state.isListening) {
      clearTimeout(state.restartTimer);
      state.restartTimer = setTimeout(function () {
        try {
          recognition.start();
        } catch (e) {
          console.log("restart skipped", e);
        }
      }, 250);
    } else {
      recordBtn.textContent = "録音開始";
      setStatus("停止中 / 単語タップで翻訳 / 長押し選択で文ごと翻訳", "#aaaaaa");
    }
  };

  // 自動スクロール停止用
  ["scroll", "touchstart", "touchmove", "mousedown", "wheel"].forEach(function (evt) {
    container.addEventListener(evt, markInteracting, { passive: true });
  });

  // 単語タップ翻訳
  resultDiv.addEventListener("click", function (e) {
    if (hasSelection()) return;

    var el = e.target;
    if (!el || !el.classList || !el.classList.contains("word")) return;

    markInteracting();
    clearActiveWord();
    el.classList.add("active");
    state.activeWordEl = el;

    var word = el.getAttribute("data-word") || el.textContent || "";
    translateText(word);
  });

  // 長押し選択翻訳
  document.addEventListener("selectionchange", function () {
    clearTimeout(state.selectionTimer);
    state.selectionTimer = setTimeout(function () {
      var sel = window.getSelection();
      var selected = sel && sel.toString ? sel.toString().trim() : "";
      if (selected) {
        markInteracting();
        clearActiveWord();
        translateText(selected);
      }
    }, 200);
  });

  render();
})();
</script>

</body>
</html>
