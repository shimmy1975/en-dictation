<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英会話ディクテくん</title>

<style>
body {
    background-color: #000;
    color: #FFFF00;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 26px;
    padding: 20px;
    margin: 0;
    height: 100vh;
    overflow: hidden;
}

#status {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 10px;
    background: #222;
    padding: 8px;
    border-radius: 8px;
}

#container {
    height: calc(100vh - 130px);
    overflow-y: auto;
}

#result {
    white-space: pre-wrap;
    line-height: 1.6;
}

/* 翻訳エリア */
#translation {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111;
    color: #00FFAA;
    font-size: 18px;
    padding: 12px;
    border-top: 1px solid #333;
}
</style>
</head>

<body>

<div id="status">タップで開始（English Dictation）</div>

<div id="container">
    <div id="result">
ここに文字が出ます。
    </div>
</div>

<div id="translation">
ここに翻訳が表示されます
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    document.getElementById('status').innerText =
        "このブラウザは音声認識に対応していません（Chrome / Safari推奨）";
} else {

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const container = document.getElementById('container');

    let isListening = false;
    let finalText = "";

    document.body.addEventListener("click", (e) => {
        // 翻訳エリアタップ時は無視（誤起動防止）
        if (e.target.id === "translation") return;

        if (!isListening) {
            finalText = "";
            resultDiv.innerText = "";
            recognition.start();
        } else {
            isListening = false;
            recognition.stop();
        }
    });

    recognition.onstart = () => {
        isListening = true;
        statusDiv.innerText = "● Listening...";
        statusDiv.style.color = "#FF3B30";
    };

    recognition.onresult = (event) => {
        let interim = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                finalText += event.results[i][0].transcript + "\n";
            } else {
                interim += event.results[i][0].transcript;
            }
        }

        resultDiv.innerText = finalText + interim;

        // 自動スクロール
        container.scrollTop = container.scrollHeight;
    };

    recognition.onerror = (event) => {
        console.log(event.error);
    };

    recognition.onend = () => {
        if (isListening) {
            recognition.start();
        } else {
            statusDiv.innerText = "停止中（タップで再開）";
            statusDiv.style.color = "#FFFF00";
        }
    };

    // ✅ 選択して翻訳
    resultDiv.addEventListener("mouseup", () => {
        const selected = window.getSelection().toString().trim();

        if (selected.length > 0) {
            translateText(selected);
        }
    });

    // ✅ 翻訳関数
    async function translateText(text) {
        try {
            const res = await fetch(
                "https://api.mymemory.translated.net/get?q=" +
                encodeURIComponent(text) +
                "&langpair=en|ja"
            );

            const data = await res.json();

            document.getElementById("translation").innerText =
                "▶ " + text + "\n→ " + data.responseData.translatedText;

        } catch (err) {
            document.getElementById("translation").innerText =
                "翻訳エラー：ネットワーク確認してください";
        }
    }
}
</script>

</body>
</html>
