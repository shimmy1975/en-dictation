<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dication App「英会話ディクテくん」</title>

  <style>
    :root {
      --bg: #000000;
      --panel: #0f0f0f;
      --border: #2a2a2a;
      --text-main: #ffff66;
      --text-sub: #a8f0d2;
      --text-muted: #aaaaaa;
      --text-white: #ffffff;
      --accent: #00ffb3;
      --danger: #ff6b6b;
      --latest-bg: rgba(255, 255, 0, 0.12);
      --latest-border: rgba(255, 255, 0, 0.28);
      --translation-bg: rgba(0, 255, 179, 0.08);
      --important-bg: rgba(255, 220, 0, 0.16);
      --important-border: rgba(255, 230, 70, 0.55);
      --important-text: #fff6a5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      padding: 12px;
      background: #050505;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }

    #title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      appearance: none;
      border: 1px solid #444;
      background: #222;
      color: var(--text-white);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: #2b2b2b;
    }

    .btn.on {
      background: #1d3424;
      border-color: #3f7f52;
      color: #ddffe7;
    }

    .btn.warn {
      background: #332400;
      border-color: #7b5a19;
      color: #ffe7b0;
    }

    .btn.undo {
      background: #1a2f3d;
      border-color: #37647c;
      color: #d8f0ff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #status {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    #container {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 135px 14px;
      scroll-behavior: smooth;
    }

    #result {
      font-size: 24px;
      line-height: 1.65;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    .line-block {
      margin: 0 0 12px 0;
      border-radius: 12px;
      padding: 8px 10px;
      border: 1px solid transparent;
    }

    .line-block.latest {
      background: var(--latest-bg);
      border-color: var(--latest-border);
    }

    .line-block.interim {
      opacity: 0.95;
    }

    .line-en {
      color: var(--text-main);
      word-break: break-word;
    }

    .line-ja {
      margin-top: 6px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-sub);
      font-weight: 600;
      background: var(--translation-bg);
      border-radius: 8px;
      padding: 6px 8px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .line-ja.pending {
      color: #7fd7bc;
      opacity: 0.85;
    }

    .line-ja.error {
      color: #ffb5b5;
      background: rgba(255, 80, 80, 0.08);
    }

    .line-ja-label {
      display: inline-block;
      font-size: 12px;
      margin-right: 8px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #d7fff1;
      vertical-align: middle;
    }

    .word {
      cursor: pointer;
    }

    .word.active {
      background: rgba(0, 255, 179, 0.18);
      border-radius: 6px;
      padding: 0 2px;
    }

    .word.important {
      color: var(--important-text);
      background: var(--important-bg);
      border-bottom: 2px solid var(--important-border);
      border-radius: 4px;
      padding: 0 2px;
    }

    #translationPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 12px 12px 12px;
    }

    #translationHeader {
      font-size: 13px;
      color: #8aeecf;
      font-weight: 700;
      margin-bottom: 6px;
    }

    #translationBody {
      min-height: 48px;
      white-space: pre-wrap;
      font-size: 18px;
      line-height: 1.5;
      color: var(--accent);
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      color: #8a8a8a;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="title">Dication App「英会話ディクテくん」</div>

    <div id="controls">
      <button id="recordBtn" class="btn primary">録音開始</button>
      <button id="splitBtn" class="btn warn">区切る</button>
      <button id="subtitleBtn" class="btn on">字幕モード ON</button>
      <button id="dictationSummaryBtn" class="btn on">要約ディクテ ON</button>
      <button id="autoTranslateBtn" class="btn on">自動翻訳 ON</button>
      <button id="summaryBtn" class="btn on">要約翻訳 ON</button>
      <button id="clearBtn" class="btn">クリア</button>
      <button id="undoBtn" class="btn undo" disabled>元に戻す</button>
    </div>

    <div id="status">
      停止中 / 要約ディクテ ON / 重要単語を強調 / 単語タップで単語翻訳 / 長押しで範囲翻訳 / 区切るで途中字幕を強制確定
    </div>
  </div>

  <div id="container">
    <div id="result">
      <div class="line-block latest">
        <div class="line-en">ここに文字が出ます。</div>
      </div>
    </div>
  </div>

  <div id="translationPanel">
    <div id="translationHeader">手動翻訳</div>
    <div id="translationBody">ここに単語・選択範囲の翻訳が表示されます。</div>
    <div class="hint">
      ・要約ディクテ ON：英語字幕自体を少し整理して読みやすく表示<br>
      ・要約翻訳 ON：フィラーや重複を少し整理してから翻訳<br>
      ・字幕モード ON：英語字幕の下に小さく日本語訳を表示
    </div>
  </div>

  <script>
    (function () {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const recordBtn = document.getElementById("recordBtn");
      const splitBtn = document.getElementById("splitBtn");
      const subtitleBtn = document.getElementById("subtitleBtn");
      const dictationSummaryBtn = document.getElementById("dictationSummaryBtn");
      const autoTranslateBtn = document.getElementById("autoTranslateBtn");
      const summaryBtn = document.getElementById("summaryBtn");
      const clearBtn = document.getElementById("clearBtn");
      const undoBtn = document.getElementById("undoBtn");
      const statusDiv = document.getElementById("status");
      const container = document.getElementById("container");
      const resultDiv = document.getElementById("result");
      const translationBody = document.getElementById("translationBody");

      const MAX_CHARS_PER_LINE = 500;
      const MAX_CHARS_PER_TRANSLATION_REQUEST = 500;

      const STOP_WORDS = new Set([
        "a","an","the","is","am","are","was","were","be","being","been",
        "i","you","he","she","it","we","they","me","him","her","us","them",
        "my","your","his","their","our","mine","yours","ours","theirs",
        "this","that","these","those",
        "in","on","at","to","for","from","of","with","by","as","into","about","over","under","between","through",
        "and","or","but","so","if","then","because","while","though",
        "do","does","did","done","have","has","had","can","could","will","would","should","may","might","must",
        "not","no","yes",
        "what","when","where","which","who","whom","why","how",
        "there","here","just","really","very","more","most","much","many",
        "uh","um","well","like"
      ]);

      const state = {
        isListening: false,
        subtitleMode: true,
        dictationSummaryMode: true,
        autoTranslate: true,
        summaryMode: true,
        lines: [], // { id, rawText, displayText, translation, translating, error }
        interimRawText: "",
        interimDisplayText: "",
        userInteracting: false,
        interactionTimer: null,
        selectionTimer: null,
        restartTimer: null,
        activeWordEl: null,
        nextId: 1,
        undoSnapshot: null,
        translationCache: {}
      };

      if (!SpeechRecognition) {
        statusDiv.textContent = "このブラウザは音声認識に対応していません（Chrome / Edge / Safari 推奨）";
        recordBtn.disabled = true;
        splitBtn.disabled = true;
        subtitleBtn.disabled = true;
        dictationSummaryBtn.disabled = true;
        autoTranslateBtn.disabled = true;
        summaryBtn.disabled = true;
        clearBtn.disabled = true;
        undoBtn.disabled = true;
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;

      function setStatus(text, color = "#aaaaaa") {
        statusDiv.textContent = text;
        statusDiv.style.color = color;
      }

      function buildStatusText(prefix = "停止中") {
        return `${prefix} / ${state.dictationSummaryMode ? "要約ディクテ ON" : "要約ディクテ OFF"} / 重要単語を強調 / 単語タップで単語翻訳 / 長押しで範囲翻訳`;
      }

      function markInteracting() {
        state.userInteracting = true;
        clearTimeout(state.interactionTimer);
        state.interactionTimer = setTimeout(() => {
          state.userInteracting = false;
        }, 1800);
      }

      function hasSelection() {
        const sel = window.getSelection();
        return !!(sel && sel.toString().trim().length > 0);
      }

      function isNearBottom(threshold = 100) {
        return (container.scrollHeight - container.scrollTop - container.clientHeight) < threshold;
      }

      function maybeAutoScroll() {
        if (state.userInteracting) return;
        if (hasSelection()) return;
        if (!isNearBottom(140)) return;
        container.scrollTop = container.scrollHeight;
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function tokenize(text) {
        return text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*|\s+|[^A-Za-z\s]+/g) || [];
      }

      function normalizeWord(word) {
        return (word || "").toLowerCase().replace(/[^a-z0-9']/g, "");
      }

      function isImportantWord(word) {
        const raw = word || "";
        const normalized = normalizeWord(raw);
        if (!normalized) return false;
        if (STOP_WORDS.has(normalized)) return false;

        const hasDigit = /\d/.test(raw);
        const startsUpper = /^[A-Z]/.test(raw);
        const isLong = normalized.length >= 6;

        return hasDigit || startsUpper || isLong;
      }

      function buildWordHtml(text) {
        const tokens = tokenize(text);
        let html = "";

        for (const token of tokens) {
          if (/^\s+$/.test(token)) {
            html += token.replace(/ /g, "&nbsp;");
          } else if (/^[A-Za-z]+(?:['’-][A-Za-z]+)*$/.test(token)) {
            const safe = escapeHtml(token);
            const importantClass = isImportantWord(token) ? " important" : "";
            html += `<span class="word${importantClass}" data-word="${safe}">${safe}</span>`;
          } else {
            html += `<span>${escapeHtml(token)}</span>`;
          }
        }

        return html;
      }

      function splitLongText(text, maxChars = MAX_CHARS_PER_LINE) {
        const cleaned = (text || "").trim();
        if (!cleaned) return [];

        const result = [];
        let remaining = cleaned;

        while (remaining.length > maxChars) {
          let cut = maxChars;

          const searchStart = Math.max(0, maxChars - 80);
          const candidate = remaining.slice(searchStart, maxChars + 1);

          let relativePos = -1;

          const punctuationMatch = candidate.match(/.*[.!?;,:\n]/);
          if (punctuationMatch && punctuationMatch[0]) {
            relativePos = punctuationMatch[0].length - 1;
          } else {
            const lastSpace = candidate.lastIndexOf(" ");
            if (lastSpace > 0) relativePos = lastSpace;
          }

          if (relativePos >= 0) {
            cut = searchStart + relativePos + 1;
          }

          const piece = remaining.slice(0, cut).trim();
          if (piece) result.push(piece);
          remaining = remaining.slice(cut).trim();
        }

        if (remaining) result.push(remaining);
        return result;
      }

      function cleanUpDictationText(text) {
        if (!text) return "";

        let t = text;

        t = t.replace(/\b(uh|um|er|ah)\b/gi, "");
        t = t.replace(/\b(you know|i mean)\b/gi, "");
        t = t.replace(/\b(like)\b/gi, "");
        t = t.replace(/\b(\w+)(\s+\1\b)+/gi, "$1");
        t = t.replace(/\s+([,.!?;:])/g, "$1");
        t = t.replace(/\s+/g, " ").trim();

        if (t.length > 0) {
          t = t.charAt(0).toUpperCase() + t.slice(1);
        }

        return t;
      }

      function cleanUpTranslationText(text) {
        if (!text) return "";

        let t = text;

        t = t.replace(/\b(uh|um|er|ah)\b/gi, "");
        t = t.replace(/\b(you know|i mean)\b/gi, "");
        t = t.replace(/\b(like)\b/gi, "");
        t = t.replace(/\b(\w+)(\s+\1\b)+/gi, "$1");
        t = t.replace(/\s+([,.!?;:])/g, "$1");
        t = t.replace(/\s+/g, " ").trim();

        if (t.length > 0) {
          t = t.charAt(0).toUpperCase() + t.slice(1);
        }

        return t;
      }

      function getDisplayText(rawText) {
        return state.dictationSummaryMode ? cleanUpDictationText(rawText) : rawText;
      }

      function prepareTranslationInput(text) {
        return state.summaryMode ? cleanUpTranslationText(text) : text;
      }

      function cloneLines(lines) {
        return lines.map(line => ({
          id: line.id,
          rawText: line.rawText,
          displayText: line.displayText,
          translation: line.translation || "",
          translating: !!line.translating,
          error: line.error || ""
        }));
      }

      function saveUndoSnapshot() {
        state.undoSnapshot = {
          lines: cloneLines(state.lines),
          interimRawText: state.interimRawText,
          interimDisplayText: state.interimDisplayText,
          nextId: state.nextId
        };
        undoBtn.disabled = false;
      }

      function restoreUndoSnapshot() {
        if (!state.undoSnapshot) return;
        state.lines = cloneLines(state.undoSnapshot.lines);
        state.interimRawText = state.undoSnapshot.interimRawText;
        state.interimDisplayText = state.undoSnapshot.interimDisplayText;
        state.nextId = state.undoSnapshot.nextId;
        state.undoSnapshot = null;
        undoBtn.disabled = true;
        render();
      }

      function clearActiveWord() {
        if (state.activeWordEl) {
          state.activeWordEl.classList.remove("active");
          state.activeWordEl = null;
        }
      }

      function render() {
        let html = "";

        if (state.subtitleMode) {
          if (state.lines.length === 0 && !state.interimDisplayText) {
            html = `
              <div class="line-block latest">
                <div class="line-en">ここに文字が出ます。</div>
              </div>
            `;
          } else {
            state.lines.forEach((line, index) => {
              const isLatestFinal = index === state.lines.length - 1 && !state.interimDisplayText;
              let jaHtml = "";

              if (state.autoTranslate) {
                if (line.error) {
                  jaHtml = `<div class="line-ja error"><span class="line-ja-label">訳</span>${escapeHtml(line.error)}</div>`;
                } else if (line.translation) {
                  const label = state.summaryMode ? "要約訳" : "訳";
                  jaHtml = `<div class="line-ja"><span class="line-ja-label">${label}</span>${escapeHtml(line.translation)}</div>`;
                } else if (line.translating) {
                  jaHtml = `<div class="line-ja pending"><span class="line-ja-label">${state.summaryMode ? "要約訳" : "訳"}</span>翻訳中…</div>`;
                }
              }

              html += `
                <div class="line-block ${isLatestFinal ? "latest" : ""}">
                  <div class="line-en">${buildWordHtml(line.displayText)}</div>
                  ${jaHtml}
                </div>
              `;
            });

            if (state.interimDisplayText) {
              html += `
                <div class="line-block latest interim">
                  <div class="line-en">${buildWordHtml(state.interimDisplayText)}</div>
                </div>
              `;
            }
          }
        } else {
          const mergedFinal = state.lines.map(line => line.displayText).join(" ");
          const merged = (mergedFinal + (state.interimDisplayText ? (mergedFinal ? " " : "") + state.interimDisplayText : "")).trim() || "ここに文字が出ます。";

          html = `
            <div class="line-block latest ${state.interimDisplayText ? "interim" : ""}">
              <div class="line-en">${buildWordHtml(merged)}</div>
            </div>
          `;
        }

        resultDiv.innerHTML = html;
        maybeAutoScroll();
      }

      function refreshAllDisplayText() {
        state.lines.forEach(line => {
          line.displayText = getDisplayText(line.rawText);
        });
        state.interimDisplayText = getDisplayText(state.interimRawText);
      }

      function appendFinalText(rawText) {
        const pieces = splitLongText(rawText, MAX_CHARS_PER_LINE);

        pieces.forEach(piece => {
          const id = state.nextId++;
          const displayText = getDisplayText(piece);
          state.lines.push({
            id,
            rawText: piece,
            displayText: displayText,
            translation: "",
            translating: false,
            error: ""
          });

          if (state.autoTranslate) {
            translateLine(id, piece);
          }
        });
      }

      function forceSplitInterim() {
        const text = (state.interimRawText || "").trim();
        if (!text) return;

        appendFinalText(text);
        state.interimRawText = "";
        state.interimDisplayText = "";
        render();
      }

      async function fetchTranslationChunk(text) {
        const url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=en|ja";

        const res = await fetch(url);
        const data = await res.json();

        if (data && data.responseData && data.responseData.translatedText) {
          return data.responseData.translatedText;
        }

        if (data && data.responseStatus === 403) {
          return "本日の翻訳上限に達した可能性があります。";
        }

        return "翻訳結果を取得できませんでした。";
      }

      async function fetchTranslationSafe(text) {
        const prepared = prepareTranslationInput(text);
        const cacheKey = `${state.summaryMode ? "summary" : "plain"}::${prepared}`;

        if (state.translationCache[cacheKey]) {
          return state.translationCache[cacheKey];
        }

        const parts = splitLongText(prepared, MAX_CHARS_PER_TRANSLATION_REQUEST);
        const translatedParts = [];

        for (const part of parts) {
          const translated = await fetchTranslationChunk(part);
          translatedParts.push(translated);
        }

        const joined = translatedParts.join("\n");
        state.translationCache[cacheKey] = joined;
        return joined;
      }

      async function translateManual(text) {
        if (!text || !text.trim()) return;

        translationBody.textContent = "翻訳中…";

        try {
          const translated = await fetchTranslationSafe(text);
          const label = state.summaryMode && /\s/.test(text.trim()) ? "要約訳" : "訳";
          translationBody.textContent = `▶ ${text}\n[${label}] ${translated}`;
        } catch (e) {
          translationBody.textContent = "翻訳エラー：ネットワークまたはAPI応答を確認してください。";
          console.error(e);
        }
      }

      async function translateLine(lineId, rawText) {
        const line = state.lines.find(l => l.id === lineId);
        if (!line) return;
        if (line.translation || line.translating) return;

        line.translating = true;
        line.error = "";
        render();

        try {
          const translated = await fetchTranslationSafe(rawText);
          const target = state.lines.find(l => l.id === lineId);
          if (target) {
            target.translation = translated;
            target.translating = false;
            target.error = "";
            render();
          }
        } catch (e) {
          const target = state.lines.find(l => l.id === lineId);
          if (target) {
            target.translation = "";
            target.translating = false;
            target.error = "翻訳取得エラー";
            render();
          }
          console.error(e);
        }
      }

      async function retranslateAllLines() {
        for (const line of state.lines) {
          line.translation = "";
          line.translating = false;
          line.error = "";
        }
        render();

        if (!state.autoTranslate) return;

        for (const line of state.lines) {
          await translateLine(line.id, line.rawText);
        }
      }

      recordBtn.addEventListener("click", () => {
        if (!state.isListening) {
          try {
            recognition.start();
          } catch (e) {
            console.log("start error", e);
          }
        } else {
          state.isListening = false;
          clearTimeout(state.restartTimer);
          try {
            recognition.stop();
          } catch (e) {
            console.log("stop error", e);
          }
        }
      });

      splitBtn.addEventListener("click", () => {
        markInteracting();
        forceSplitInterim();
      });

      subtitleBtn.addEventListener("click", () => {
        state.subtitleMode = !state.subtitleMode;
        subtitleBtn.textContent = state.subtitleMode ? "字幕モード ON" : "字幕モード OFF";
        subtitleBtn.classList.toggle("on", state.subtitleMode);
        render();
      });

      dictationSummaryBtn.addEventListener("click", () => {
        state.dictationSummaryMode = !state.dictationSummaryMode;
        dictationSummaryBtn.textContent = state.dictationSummaryMode ? "要約ディクテ ON" : "要約ディクテ OFF";
        dictationSummaryBtn.classList.toggle("on", state.dictationSummaryMode);

        refreshAllDisplayText();
        setStatus(buildStatusText(state.isListening ? "● Listening..." : "停止中"), state.isListening ? "#ff6b6b" : "#aaaaaa");
        render();
      });

      autoTranslateBtn.addEventListener("click", async () => {
        state.autoTranslate = !state.autoTranslate;
        autoTranslateBtn.textContent = state.autoTranslate ? "自動翻訳 ON" : "自動翻訳 OFF";
        autoTranslateBtn.classList.toggle("on", state.autoTranslate);
        render();

        if (state.autoTranslate) {
          await retranslateAllLines();
        }
      });

      summaryBtn.addEventListener("click", async () => {
        state.summaryMode = !state.summaryMode;
        summaryBtn.textContent = state.summaryMode ? "要約翻訳 ON" : "要約翻訳 OFF";
        summaryBtn.classList.toggle("on", state.summaryMode);

        if (state.autoTranslate) {
          await retranslateAllLines();
        } else {
          render();
        }
      });

      clearBtn.addEventListener("click", () => {
        saveUndoSnapshot();
        state.lines = [];
        state.interimRawText = "";
        state.interimDisplayText = "";
        clearActiveWord();
        translationBody.textContent = "ここに単語・選択範囲の翻訳が表示されます。";
        render();
      });

      undoBtn.addEventListener("click", () => {
        restoreUndoSnapshot();
      });

      recognition.onstart = () => {
        state.isListening = true;
        recordBtn.textContent = "録音停止";
        setStatus(buildStatusText("● Listening..."), "#ff6b6b");
      };

      recognition.onresult = (event) => {
        let interim = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          let text = event.results[i][0].transcript;
          if (!text) continue;
          text = text.trim();
          if (!text) continue;

          if (event.results[i].isFinal) {
            appendFinalText(text);
          } else {
            interim += (interim ? " " : "") + text;
          }
        }

        const interimPieces = splitLongText(interim, MAX_CHARS_PER_LINE);
        if (interimPieces.length > 1) {
          for (let i = 0; i < interimPieces.length - 1; i++) {
            appendFinalText(interimPieces[i]);
          }
          state.interimRawText = interimPieces[interimPieces.length - 1];
        } else {
          state.interimRawText = interim;
        }

        state.interimDisplayText = getDisplayText(state.interimRawText);
        render();
      };

      recognition.onerror = (event) => {
        console.log("speech error:", event.error);

        if (event.error === "not-allowed") {
          state.isListening = false;
          recordBtn.textContent = "録音開始";
          setStatus("マイクが許可されていません。ブラウザのマイク許可を確認してください。", "#ff9999");
          return;
        }

        if (event.error !== "no-speech" && event.error !== "aborted") {
          setStatus("認識エラー: " + event.error, "#ff9999");
        }
      };

      recognition.onend = () => {
        if (state.isListening) {
          clearTimeout(state.restartTimer);
          state.restartTimer = setTimeout(() => {
            try {
              recognition.start();
            } catch (e) {
              console.log("restart skipped", e);
            }
          }, 250);
        } else {
          recordBtn.textContent = "録音開始";
          setStatus(buildStatusText("停止中"), "#aaaaaa");
        }
      };

      ["scroll", "touchstart", "touchmove", "mousedown", "wheel"].forEach(evt => {
        container.addEventListener(evt, markInteracting, { passive: true });
      });

      resultDiv.addEventListener("click", (e) => {
        if (hasSelection()) return;

        const el = e.target.closest(".word");
        if (!el) return;

        markInteracting();
        clearActiveWord();
        el.classList.add("active");
        state.activeWordEl = el;

        const word = el.getAttribute("data-word") || el.textContent || "";
        translateManual(word);
      });

      document.addEventListener("selectionchange", () => {
        clearTimeout(state.selectionTimer);
        state.selectionTimer = setTimeout(() => {
          const sel = window.getSelection();
          const selected = sel && sel.toString ? sel.toString().trim() : "";
          if (selected) {
            markInteracting();
            clearActiveWord();
            translateManual(selected);
          }
        }, 200);
      });

      render();
    })();
  </script>
</body>
</html>
